<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8f4ed"/>

  <!-- Typewriter (left) -->
  <g transform="translate(80, 60)">
    <!-- Body -->
    <rect x="20" y="80" width="220" height="140" rx="8" fill="#4a4035" stroke="#2c2416" stroke-width="2"/>
    <!-- Paper roller -->
    <rect x="30" y="55" width="200" height="30" rx="4" fill="#6b5e4e" stroke="#2c2416" stroke-width="1.5"/>
    <!-- Paper -->
    <rect x="60" y="20" width="140" height="50" fill="#f8f4ed" stroke="#ccc" stroke-width="1"/>
    <line x1="75" y1="35" x2="185" y2="35" stroke="#999" stroke-width="1.5"/>
    <line x1="75" y1="45" x2="175" y2="45" stroke="#999" stroke-width="1.5"/>
    <line x1="75" y1="55" x2="160" y2="55" stroke="#999" stroke-width="1.5"/>
    <!-- Keys row 1 -->
    <rect x="35" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="63" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="91" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="119" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="147" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="175" y="100" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <!-- Keys row 2 -->
    <rect x="42" y="125" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="70" y="125" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="98" y="125" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="126" y="125" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="154" y="125" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <!-- Keys row 3 -->
    <rect x="35" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="63" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="91" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="119" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="147" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <rect x="175" y="150" width="22" height="18" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <!-- Space bar area -->
    <rect x="60" y="175" width="140" height="16" rx="3" fill="#7a6a58" stroke="#3a2e22" stroke-width="1"/>
    <!-- Carriage return lever -->
    <rect x="200" y="60" width="35" height="8" rx="3" fill="#9a8a78" stroke="#2c2416" stroke-width="1"/>
  </g>

  <!-- Arrow (center) -->
  <g transform="translate(350, 170)">
    <line x1="0" y1="30" x2="80" y2="30" stroke="#c9783a" stroke-width="3"/>
    <polygon points="80,22 100,30 80,38" fill="#c9783a"/>
    <!-- Small historical note -->
    <text x="40" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888">150 years</text>
  </g>

  <!-- Modern keyboard (right) -->
  <g transform="translate(470, 100)">
    <!-- Base -->
    <rect x="0" y="60" width="260" height="160" rx="10" fill="#ddd9d2" stroke="#b0aba4" stroke-width="2"/>
    <!-- Keys row 1 (function row subtle) -->
    <rect x="10" y="70" width="240" height="14" rx="2" fill="#c8c4bc" stroke="#aaa" stroke-width="0.5"/>
    <!-- Number row -->
    <g fill="#f0ede8" stroke="#aaa" stroke-width="0.8">
      <rect x="10" y="90" width="20" height="18" rx="2"/>
      <rect x="32" y="90" width="20" height="18" rx="2"/>
      <rect x="54" y="90" width="20" height="18" rx="2"/>
      <rect x="76" y="90" width="20" height="18" rx="2"/>
      <rect x="98" y="90" width="20" height="18" rx="2"/>
      <rect x="120" y="90" width="20" height="18" rx="2"/>
      <rect x="142" y="90" width="20" height="18" rx="2"/>
      <rect x="164" y="90" width="20" height="18" rx="2"/>
      <rect x="186" y="90" width="20" height="18" rx="2"/>
      <rect x="208" y="90" width="40" height="18" rx="2"/>
    </g>
    <!-- QWERTY row -->
    <g fill="#f0ede8" stroke="#aaa" stroke-width="0.8">
      <rect x="14" y="112" width="20" height="18" rx="2"/>
      <rect x="36" y="112" width="20" height="18" rx="2"/>
      <rect x="58" y="112" width="20" height="18" rx="2"/>
      <rect x="80" y="112" width="20" height="18" rx="2"/>
      <rect x="102" y="112" width="20" height="18" rx="2"/>
      <rect x="124" y="112" width="20" height="18" rx="2"/>
      <rect x="146" y="112" width="20" height="18" rx="2"/>
      <rect x="168" y="112" width="20" height="18" rx="2"/>
      <rect x="190" y="112" width="20" height="18" rx="2"/>
      <rect x="212" y="112" width="36" height="18" rx="2"/>
    </g>
    <!-- Home row -->
    <g fill="#f0ede8" stroke="#aaa" stroke-width="0.8">
      <rect x="18" y="134" width="25" height="18" rx="2"/>
      <rect x="45" y="134" width="20" height="18" rx="2"/>
      <rect x="67" y="134" width="20" height="18" rx="2"/>
      <rect x="89" y="134" width="20" height="18" rx="2"/>
      <rect x="111" y="134" width="20" height="18" rx="2"/>
      <rect x="133" y="134" width="20" height="18" rx="2"/>
      <rect x="155" y="134" width="20" height="18" rx="2"/>
      <rect x="177" y="134" width="20" height="18" rx="2"/>
      <rect x="199" y="134" width="49" height="18" rx="2"/>
    </g>
    <!-- Bottom row (space) -->
    <g fill="#f0ede8" stroke="#aaa" stroke-width="0.8">
      <rect x="10" y="156" width="30" height="18" rx="2"/>
      <rect x="42" y="156" width="22" height="18" rx="2"/>
      <rect x="66" y="156" width="140" height="18" rx="2"/>
      <rect x="208" y="156" width="40" height="18" rx="2"/>
    </g>
    <!-- Small LED / backlight glow suggestion -->
    <rect x="0" y="60" width="260" height="160" rx="10" fill="none" stroke="#7ab8e8" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Labels -->
  <text x="190" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4a4035" font-style="italic">Remington No. 2, c. 1878</text>
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4a4035" font-style="italic">Modern keyboard, c. 2025</text>

  <!-- Title text -->
  <text x="400" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#888">The tools change. The anxiety doesn't.</text>
</svg>
