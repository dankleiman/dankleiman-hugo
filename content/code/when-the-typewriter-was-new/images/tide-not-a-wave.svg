<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#f8f4ed"/>

  <!-- LEFT panel: The Wave (panic) -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="290" rx="8" fill="#e8e0d5" stroke="#c8bfb4" stroke-width="1"/>

    <!-- Sky -->
    <rect x="0" y="0" width="340" height="170" rx="8" fill="#b8d4e8"/>

    <!-- Dark stormy sky top -->
    <rect x="0" y="0" width="340" height="60" rx="8" fill="#7a9aaa"/>
    <ellipse cx="80" cy="30" rx="60" ry="20" fill="#6a8898" opacity="0.7"/>
    <ellipse cx="200" cy="20" rx="80" ry="22" fill="#6a8898" opacity="0.8"/>
    <ellipse cx="300" cy="35" rx="50" ry="18" fill="#6a8898" opacity="0.6"/>

    <!-- Crashing wave -->
    <path d="M 0 200 Q 40 80 100 130 Q 140 160 170 90 Q 200 30 230 100 Q 260 150 290 80 Q 310 40 340 120 L 340 240 L 0 240 Z" fill="#2a6fa8" opacity="0.85"/>
    <!-- Wave crest foam -->
    <path d="M 165 90 Q 190 60 215 95 Q 230 75 250 90" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 80 130 Q 100 100 125 125" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 285 80 Q 310 55 330 80" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Beach/shore -->
    <rect x="0" y="240" width="340" height="50" rx="0" fill="#c8a86a"/>
    <path d="M 0 240 Q 80 230 160 242 Q 240 254 340 238 L 340 250 Q 240 265 160 254 Q 80 244 0 252 Z" fill="#b89a5a"/>

    <!-- Tiny panicked figure -->
    <circle cx="170" cy="228" r="5" fill="#2c2416"/>
    <line x1="170" y1="233" x2="170" y2="248" stroke="#2c2416" stroke-width="2"/>
    <line x1="162" y1="238" x2="178" y2="236" stroke="#2c2416" stroke-width="2"/>
    <line x1="170" y1="248" x2="163" y2="258" stroke="#2c2416" stroke-width="1.5"/>
    <line x1="170" y1="248" x2="177" y2="258" stroke="#2c2416" stroke-width="1.5"/>
    <!-- Arms raised in panic -->
    <line x1="162" y1="238" x2="155" y2="230" stroke="#2c2416" stroke-width="2"/>
    <line x1="178" y1="236" x2="185" y2="228" stroke="#2c2416" stroke-width="2"/>

    <text x="170" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2c2416" font-weight="bold">The Wave</text>
    <text x="170" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">how it feels</text>
  </g>

  <!-- RIGHT panel: The Tide (gradual) -->
  <g transform="translate(430, 20)">
    <rect x="0" y="0" width="340" height="290" rx="8" fill="#e8e0d5" stroke="#c8bfb4" stroke-width="1"/>

    <!-- Calm sky -->
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#c8dff0"/>
    <!-- Gentle horizon glow -->
    <rect x="0" y="140" width="340" height="50" fill="#daeaf8" opacity="0.5"/>

    <!-- Calm sea — multiple gentle tide lines -->
    <!-- Tide level 1 (past, lowest) -->
    <path d="M 0 260 Q 85 255 170 262 Q 255 269 340 258 L 340 290 L 0 290 Z" fill="#5a9fcc" opacity="0.3"/>
    <!-- Tide level 2 -->
    <path d="M 0 245 Q 85 240 170 247 Q 255 254 340 243 L 340 290 L 0 290 Z" fill="#5a9fcc" opacity="0.35"/>
    <!-- Tide level 3 -->
    <path d="M 0 228 Q 85 223 170 230 Q 255 237 340 226 L 340 290 L 0 290 Z" fill="#3a8fbc" opacity="0.45"/>
    <!-- Current tide level -->
    <path d="M 0 208 Q 85 203 170 210 Q 255 217 340 206 L 340 290 L 0 290 Z" fill="#2a7fab" opacity="0.7"/>

    <!-- Shore -->
    <rect x="0" y="258" width="340" height="32" rx="0" fill="#c8a86a" opacity="0.4"/>

    <!-- Tide markers (arrows showing gradual rise) -->
    <g stroke="#c9783a" stroke-width="1.5" fill="none">
      <line x1="20" y1="258" x2="20" y2="210"/>
      <polygon points="14,214 20,200 26,214" fill="#c9783a" stroke="none"/>
      <text x="30" y="235" font-family="Georgia, serif" font-size="10" fill="#c9783a">rising</text>
      <text x="30" y="248" font-family="Georgia, serif" font-size="10" fill="#c9783a">slowly</text>
    </g>

    <!-- Waterline labels -->
    <text x="310" y="265" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#5a7a8a">1870s</text>
    <text x="310" y="248" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#5a7a8a">1880s</text>
    <text x="310" y="232" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#5a7a8a">1890s</text>
    <text x="310" y="215" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#5a7a8a">1900s</text>

    <!-- Calm figure watching -->
    <circle cx="170" cy="246" r="5" fill="#2c2416"/>
    <line x1="170" y1="251" x2="170" y2="266" stroke="#2c2416" stroke-width="2"/>
    <line x1="162" y1="256" x2="178" y2="256" stroke="#2c2416" stroke-width="2"/>
    <line x1="170" y1="266" x2="163" y2="276" stroke="#2c2416" stroke-width="1.5"/>
    <line x1="170" y1="266" x2="177" y2="276" stroke="#2c2416" stroke-width="1.5"/>
    <!-- Arms relaxed -->
    <line x1="162" y1="256" x2="156" y2="262" stroke="#2c2416" stroke-width="2"/>
    <line x1="178" y1="256" x2="184" y2="262" stroke="#2c2416" stroke-width="2"/>

    <text x="170" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2c2416" font-weight="bold">The Tide</text>
    <text x="170" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#666" font-style="italic">what actually happens</text>
  </g>

  <!-- VS label in center -->
  <text x="400" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#4a4035" font-weight="bold">vs.</text>
</svg>
