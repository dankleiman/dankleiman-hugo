<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <rect width="800" height="320" fill="#f8f4ed"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2c2416" font-weight="bold">From Novelty to Invisible Foundation</text>

  <!-- Timeline spine -->
  <line x1="60" y1="130" x2="740" y2="130" stroke="#4a4035" stroke-width="2.5"/>
  <!-- Arrow at end -->
  <polygon points="740,124 755,130 740,136" fill="#4a4035"/>

  <!-- Phase backgrounds -->
  <!-- Phase 1: Experimental -->
  <rect x="60" y="55" width="200" height="160" rx="6" fill="#e8ddd0" stroke="#c8b89a" stroke-width="1" opacity="0.6"/>
  <!-- Phase 2: Adoption -->
  <rect x="280" y="55" width="200" height="160" rx="6" fill="#dde8d8" stroke="#a8c898" stroke-width="1" opacity="0.6"/>
  <!-- Phase 3: Standard -->
  <rect x="500" y="55" width="200" height="160" rx="6" fill="#d8dde8" stroke="#98a8c8" stroke-width="1" opacity="0.6"/>

  <!-- Phase labels -->
  <text x="160" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6a5a45" font-weight="bold">Experimental</text>
  <text x="380" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4a6a3a" font-weight="bold">Adoption</text>
  <text x="600" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a4a6a" font-weight="bold">Invisible Foundation</text>

  <!-- TYPEWRITER milestones (above line) -->
  <!-- 1868 patent -->
  <circle cx="100" cy="130" r="7" fill="#7a6a58" stroke="#4a4035" stroke-width="1.5"/>
  <line x1="100" y1="123" x2="100" y2="90" stroke="#7a6a58" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="100" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1868</text>
  <text x="100" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Sholes patent</text>

  <!-- 1874 first commercial -->
  <circle cx="175" cy="130" r="7" fill="#7a6a58" stroke="#4a4035" stroke-width="1.5"/>
  <line x1="175" y1="137" x2="175" y2="175" stroke="#7a6a58" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="175" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1874</text>
  <text x="175" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Remington sells</text>
  <text x="175" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">first models</text>

  <!-- 1881 YWCA typing classes -->
  <circle cx="310" cy="130" r="7" fill="#5a8a4a" stroke="#2a5a1a" stroke-width="1.5"/>
  <line x1="310" y1="123" x2="310" y2="90" stroke="#5a8a4a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="310" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1881</text>
  <text x="310" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Typing schools open</text>

  <!-- 1890s office standard -->
  <circle cx="400" cy="130" r="7" fill="#5a8a4a" stroke="#2a5a1a" stroke-width="1.5"/>
  <line x1="400" y1="137" x2="400" y2="175" stroke="#5a8a4a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="400" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1890s</text>
  <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Standard office</text>
  <text x="400" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">equipment</text>

  <!-- 1903 Census Bureau -->
  <circle cx="470" cy="130" r="7" fill="#4a5a8a" stroke="#2a3a5a" stroke-width="1.5"/>
  <line x1="470" y1="123" x2="470" y2="90" stroke="#4a5a8a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="470" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1903</text>
  <text x="470" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">North looks back</text>

  <!-- 1900s-1920s universal -->
  <circle cx="580" cy="130" r="7" fill="#4a5a8a" stroke="#2a3a5a" stroke-width="1.5"/>
  <line x1="580" y1="137" x2="580" y2="175" stroke="#4a5a8a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="580" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">1920s</text>
  <text x="580" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Universal in</text>
  <text x="580" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">business</text>

  <!-- "Today" marker (keyboard era) -->
  <circle cx="670" cy="130" r="7" fill="#4a5a8a" stroke="#2a3a5a" stroke-width="1.5"/>
  <line x1="670" y1="123" x2="670" y2="90" stroke="#4a5a8a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="670" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a4035">Today</text>
  <text x="670" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#666">Keyboard = invisible</text>

  <!-- AI marker (red, in experimental zone) -->
  <circle cx="130" cy="130" r="9" fill="#c9783a" stroke="#8a4a1a" stroke-width="2"/>
  <text x="130" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="white" font-weight="bold">AI</text>

  <!-- AI label below -->
  <line x1="130" y1="139" x2="130" y2="230" stroke="#c9783a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="80" y="230" width="100" height="36" rx="4" fill="#c9783a" opacity="0.15" stroke="#c9783a" stroke-width="1"/>
  <text x="130" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a4a1a" font-weight="bold">AI is here</text>
  <text x="130" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8a4a1a">~2020s</text>

  <!-- Span bracket for typewriter journey -->
  <line x1="100" y1="48" x2="670" y2="48" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="100" y1="44" x2="100" y2="52" stroke="#888" stroke-width="1.5"/>
  <line x1="670" y1="44" x2="670" y2="52" stroke="#888" stroke-width="1.5"/>
  <text x="385" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888">~50 years for the typewriter to become invisible</text>

  <!-- Bottom note -->
  <text x="400" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888" font-style="italic">The next model release won't complete the revolution. Neither did the next typewriter.</text>
</svg>
